<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咨詢登記 - 佳思教育</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', -apple-system, sans-serif; color: #1a1a2e; background: #f8f9ff; }
    nav {
      background: rgba(15,12,41,0.95);
      backdrop-filter: blur(20px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    nav .logo { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-size: 1.4rem; font-weight: 900; text-decoration: none; }
    nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
    nav a:hover { color: #fff; }
    .form-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6rem 1rem 3rem; }
    .form-card {
      background: #fff;
      border-radius: 24px;
      padding: 3rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 4px 40px rgba(0,0,0,0.06);
    }
    .form-card h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .form-card .subtitle { color: #6b7280; margin-bottom: 2rem; font-size: 0.95rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 500; color: #374151; margin-bottom: 0.3rem; }
    .form-group label .req { color: #f5576c; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      margin-top: 0.5rem;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15,12,41,0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .overlay-box {
      background: #fff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .overlay-box .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .overlay-box h2 { font-size: 1.5rem; margin-bottom: 0.8rem; color: #1a1a2e; }
    .overlay-box p { color: #6b7280; line-height: 1.8; margin-bottom: 1.5rem; }
    .overlay-box .countdown { font-size: 0.9rem; color: #9ca3af; }
    .overlay-box .countdown span { font-weight: 700; color: #667eea; }

    @media (max-width: 600px) {
      .form-card { padding: 1.5rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><img src="JnTlogo.jpg" alt="佳思教育" class="nav-logo"> 佳思教育</a>
  <a href="index.html">返回首頁</a>
</nav>

<div class="form-page">
  <div class="form-card">
    <h1>免費咨詢登記</h1>
    <p class="subtitle">填寫以下信息，我們將為您的孩子量身定制學習方案</p>

    <form id="consultForm">
      <div class="form-row">
        <div class="form-group">
          <label>父母親姓名 <span class="req">*</span></label>
          <input type="text" id="parent_name" required placeholder="如：張志明">
        </div>
        <div class="form-group">
          <label>年齡</label>
          <input type="number" id="parent_age" placeholder="如：38">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>聯繫手機 <span class="req">*</span></label>
          <input type="tel" id="phone" required placeholder="如：9123 4567">
        </div>
        <div class="form-group">
          <label>郵箱</label>
          <input type="email" id="email" placeholder="example@email.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>小孩年齡</label>
          <input type="number" id="child_age" placeholder="如：8">
        </div>
        <div class="form-group">
          <label>在讀學校</label>
          <input type="text" id="school" placeholder="如：聖保羅書院">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>年級</label>
          <input type="text" id="grade" placeholder="如：小四 / 中二">
        </div>
        <div class="form-group">
          <label>成績 <span class="req">*</span></label>
          <select id="academic_level" required>
            <option value="">請選擇</option>
            <option value="good">好</option>
            <option value="average">中</option>
            <option value="poor">差</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>希望是什麼</label>
        <textarea id="expectation" placeholder="如：希望提升數學成績，培養邏輯思維能力..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">提交咨詢</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="icon">🎉</div>
    <h2>提交成功！</h2>
    <p>我們會盡快聯繫您，<br>為您量身定制一套獨特的方案</p>
    <div class="countdown"><span id="countdown">3</span> 秒后返回首頁...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fuuwjceawowojecaqfru.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_M3lmOrr1QDDkkKE3r9q7qQ_mVnLlYtQ'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('consultForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = document.getElementById('submitBtn')
    btn.disabled = true
    btn.textContent = '提交中...'

    const data = {
      parent_name: document.getElementById('parent_name').value.trim(),
      parent_age: parseInt(document.getElementById('parent_age').value) || null,
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim() || null,
      child_age: parseInt(document.getElementById('child_age').value) || null,
      school: document.getElementById('school').value.trim() || null,
      grade: document.getElementById('grade').value.trim() || null,
      academic_level: document.getElementById('academic_level').value,
      expectation: document.getElementById('expectation').value.trim() || null,
    }

    const { error } = await supabase.from('inquiries').insert(data)

    if (error) {
      alert('提交失敗，請稍後重試：' + error.message)
      btn.disabled = false
      btn.textContent = '提交咨詢'
      return
    }

    document.getElementById('overlay').classList.add('show')
    let sec = 3
    document.getElementById('countdown').textContent = sec
    const timer = setInterval(() => {
      sec--
      document.getElementById('countdown').textContent = sec
      if (sec <= 0) {
        clearInterval(timer)
        window.location.href = 'index.html'
      }
    }, 1000)
  })
</script>

</body>
</html>
