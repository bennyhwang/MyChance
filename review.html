<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="JnTlogo.jpg" type="image/jpeg">
  <title>課程回看 - 佳思教育</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', -apple-system, sans-serif; color: #1a1a2e; overflow-x: hidden; background: #f8f9ff; }

    nav {
      background: rgba(15,12,41,0.95); backdrop-filter: blur(20px); padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    nav .logo { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-size: 1.4rem; font-weight: 900; text-decoration: none; }
    .nav-logo { height: 36px; width: auto; border-radius: 6px; }
    nav .nav-right { display: flex; align-items: center; gap: 1rem; }
    nav .nav-right a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; transition: all 0.3s; }
    nav .nav-right a:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); padding: 1rem; }
    .login-box { background: #fff; border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .login-box h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .login-box p { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .login-box .form-group { text-align: left; margin-bottom: 1rem; }
    .login-box .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; color: #374151; }
    .login-box .form-group input { width: 100%; padding: 0.7rem 1rem; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; font-family: inherit; outline: none; transition: border 0.3s; }
    .login-box .form-group input:focus { border-color: #667eea; }
    .login-btn { width: 100%; padding: 0.8rem; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-family: inherit; cursor: pointer; transition: all 0.3s; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .login-error { color: #ef4444; font-size: 0.85rem; margin-top: 0.8rem; display: none; text-align: center; }

    .page-content { padding: 6rem 2rem 3rem; max-width: 1400px; margin: 0 auto; display: none; }
    .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.8rem; }
    .page-header p { color: #6b7280; font-size: 0.95rem; }
    .search-bar { width: 100%; max-width: 400px; padding: 0.7rem 1rem; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; font-family: inherit; outline: none; transition: border 0.3s; }
    .search-bar:focus { border-color: #667eea; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 2rem; }
    .video-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); transition: all 0.3s; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
    .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .video-info { padding: 1.2rem 1.5rem; }
    .video-info h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
    .video-info .course-tag { display: inline-block; background: #eef2ff; color: #667eea; font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 6px; margin-bottom: 0.5rem; }
    .video-info .desc { color: #6b7280; font-size: 0.9rem; line-height: 1.6; }
    .video-info .meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .platform-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; color: #fff; }
    .platform-youtube { background: #ff0000; }
    .platform-bilibili { background: #00a1d6; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: #9ca3af; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    @media (max-width: 768px) {
      .video-grid { grid-template-columns: 1fr; }
      .page-content { padding: 5rem 1rem 2rem; }
      nav .nav-right a { font-size: 0.8rem; padding: 0.3rem 0.8rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="JnTlogo.jpg" alt="佳思教育" class="nav-logo"> 佳思教育</a>
  <div class="nav-right">
    <a href="index.html">返回首頁</a>
    <a href="#" id="logoutLink" style="display:none;" onclick="logout()">登出</a>
  </div>
</nav>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>課程回看</h2>
    <p>請使用家長帳號登入</p>
    <div class="form-group"><label>用戶名</label><input type="text" id="loginUsername" placeholder="請輸入用戶名"></div>
    <div class="form-group"><label>密碼</label><input type="password" id="loginPassword" placeholder="請輸入密碼"></div>
    <button class="login-btn" id="loginBtn" onclick="login()">登錄</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="page-content" id="appContent">
  <div class="page-header">
    <div>
      <h1>課程回看</h1>
      <p>瀏覽所有課程錄影</p>
    </div>
    <input type="text" class="search-bar" id="searchInput" placeholder="搜索影片標題或課程..." oninput="renderVideos()">
  </div>
  <div class="video-grid" id="videoGrid"><div class="empty-state"><div class="icon">📺</div><div>載入中...</div></div></div>
</div>

<script>
const SUPABASE_URL = 'https://fuuwjceawowojecaqfru.supabase.co'
const SUPABASE_KEY = 'sb_publishable_M3lmOrr1QDDkkKE3r9q7qQ_mVnLlYtQ'
let allVideos = []

async function login() {
  const username = document.getElementById('loginUsername').value.trim()
  const password = document.getElementById('loginPassword').value
  const btn = document.getElementById('loginBtn')
  const errEl = document.getElementById('loginError')
  errEl.style.display = 'none'
  if (!username || !password) { errEl.textContent = '請輸入用戶名和密碼'; errEl.style.display = 'block'; return }
  btn.disabled = true; btn.textContent = '登錄中...'
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/login_account', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_username: username, p_password: password }),
    })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const result = await res.json()
    if (!result || result.length === 0) { errEl.textContent = '用戶名或密碼錯誤'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = '登錄'; return }
    const acct = result[0]
    localStorage.setItem('review_session', JSON.stringify({ username: acct.username, display_name: acct.display_name, role: acct.role }))
    showApp()
  } catch (err) { errEl.textContent = '登錄失敗：' + err.message; errEl.style.display = 'block' }
  btn.disabled = false; btn.textContent = '登錄'
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none'
  document.getElementById('appContent').style.display = 'block'
  document.getElementById('logoutLink').style.display = 'inline'
  loadVideos()
}

function logout() {
  localStorage.removeItem('review_session')
  document.getElementById('loginPage').style.display = 'flex'
  document.getElementById('appContent').style.display = 'none'
  document.getElementById('logoutLink').style.display = 'none'
}

function getEmbedUrl(platform, videoId) {
  if (platform === 'youtube') return 'https://www.youtube.com/embed/' + videoId
  return 'https://player.bilibili.com/player.html?bvid=' + videoId
}

function renderVideos() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase()
  const filtered = q ? allVideos.filter(function(v) { return v.title.toLowerCase().includes(q) || (v.course_name || '').toLowerCase().includes(q) }) : allVideos
  const grid = document.getElementById('videoGrid')
  if (!filtered.length) { grid.innerHTML = '<div class="empty-state"><div class="icon">📺</div><div>' + (q ? '未找到符合的影片' : '暫無影片') + '</div></div>'; return }
  grid.innerHTML = filtered.map(function(v) {
    var platLabel = v.platform === 'youtube' ? 'YouTube' : 'Bilibili'
    var platClass = v.platform === 'youtube' ? 'platform-youtube' : 'platform-bilibili'
    return '<div class="video-card"><div class="video-wrapper"><iframe src="' + getEmbedUrl(v.platform, v.video_id) + '" allowfullscreen loading="lazy"></iframe></div><div class="video-info">' + (v.course_name ? '<span class="course-tag">' + escHtml(v.course_name) + '</span>' : '') + '<h3>' + escHtml(v.title) + '</h3>' + (v.description ? '<div class="desc">' + escHtml(v.description) + '</div>' : '') + '<div class="meta"><span class="platform-badge ' + platClass + '">' + platLabel + '</span></div></div></div>'
  }).join('')
}

function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

async function loadVideos() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/course_videos?order=created_at.desc', { headers: { 'apikey': SUPABASE_KEY } })
    allVideos = await res.json()
    renderVideos()
  } catch (e) { document.getElementById('videoGrid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div>載入失敗</div></div>' }
}

;(function() {
  const session = localStorage.getItem('review_session')
  if (session) { try { showApp() } catch(_) { localStorage.removeItem('review_session') } }
})()
</script>

</body>
</html>
