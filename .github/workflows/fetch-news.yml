name: Fetch Education News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and parse RSS feeds
        run: node .github/workflows/fetch-news.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add news-data.json
          git diff --cached --quiet || (git commit -m "Update education news [automated]" && git push)
