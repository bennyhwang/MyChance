name: Fetch Education News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RSS feeds
        run: |
          curl -sL --user-agent "Mozilla/5.0" -o rss_edb_press.xml "https://www.edb.gov.hk/tc/press_release_rss.xml"
          curl -sL --user-agent "Mozilla/5.0" -o rss_edb_news.xml "https://www.edb.gov.hk/tc/whats_new_rss.xml"
          curl -sL --user-agent "Mozilla/5.0" -o rss_mingpao.xml "https://life.mingpao.com/rss/lf/edu"
          curl -sL --user-agent "Mozilla/5.0" -o rss_hk01.xml "https://www.hk01.com/rss/%E6%95%99%E8%82%B2"
          echo "Downloads done"
      - name: Parse and save
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const sources = [
            { file: 'rss_edb_press.xml', name: '教育局新聞稿' },
            { file: 'rss_edb_news.xml', name: '教育局最新消息' },
            { file: 'rss_mingpao.xml', name: '明報教育' },
            { file: 'rss_hk01.xml', name: '香港01' },
          ];
          let all = [];
          for (const s of sources) {
            try {
              const xml = fs.readFileSync(s.file, 'utf8');
              const items = [];
              const itemRe = /<item>[\s\S]*?<\/item>/g;
              let m;
              while ((m = itemRe.exec(xml)) !== null) {
                const g = (tag) => {
                  const r = new RegExp('<' + tag + '[^>]*>([\\s\\S]*?)<\\/' + tag + '>');
                  const x = m[0].match(r);
                  return x ? x[1].trim().replace(/<!\[CDATA\[|\]\]>/g, '').replace(/<[^>]+>/g, '').trim() : '';
                };
                items.push({ title: g('title'), link: g('link'), description: g('description').slice(0,200), pubDate: g('pubDate'), source: s.name });
              }
              all = all.concat(items);
              console.log('OK:', s.name, items.length);
            } catch(e) { console.log('FAIL:', s.name, e.message); }
          }
          all.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
          fs.writeFileSync('news-data.json', JSON.stringify({ items: all.slice(0,50), updated: new Date().toISOString() }));
          console.log('Saved', all.length, 'items');
          SCRIPT
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add news-data.json
          git diff --cached --quiet || (git commit -m "Update education news [automated]" && git push)
