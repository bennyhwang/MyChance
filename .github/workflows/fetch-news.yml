name: Fetch Education News

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download EDB news page
        run: |
          curl -sL --user-agent "Mozilla/5.0" -o edb_all.html "https://www.edb.gov.hk/sc/news/all.html"
          echo "Download done"
      - name: Parse and save
        run: node .github/workflows/fetch-news.mjs
        env:
          NODE_OPTIONS: '--unhandled-rejections=strict'
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add news-data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update education news [automated]"
          git fetch origin main
          git rebase -X theirs origin/main || git rebase --abort
          git push origin main || git push --force-with-lease origin main
